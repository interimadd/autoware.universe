# Package defaults for the back-end (fusion) Node. `arbiter` mirrors
# autoware_traffic_light_arbiter's own package defaults, moved under the `arbiter.` prefix.
# multi_camera_fusion and crosswalk_estimator are not exposed as parameters: no deployment has ever
# needed to change them from their fixed values, so declare_fusion_config() hardcodes them instead
# (see traffic_light_fusion_node.cpp). `camera_namespaces` is deliberately not here either: which
# cameras feed the back-end is a per-deployment fact, injected by the launch file, the same way the
# front-end's model/label paths are.
/**:
  ros__parameters:
    arbiter:
      external_delay_tolerance: 5.0
      external_time_tolerance: 5.0
      perception_time_tolerance: 1.0
      source_priority: "confidence"  # Options: "external", "perception", "confidence"
      enable_signal_matching: false
